name: Distribution and finite checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/check_release.py
      - run: python scripts/check_entrance.py
      - run: python scripts/test_release.py
      # This job does not compile Lean and does not publish anything.
